<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>属性克制计算器</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f7fb;
      --panel: #ffffff;
      --panel-soft: #f9fbff;
      --ink: #1f2937;
      --muted: #64748b;
      --line: #d8e0ea;
      --accent: #ea6a47;
      --accent-soft: #fff0ea;
      --teal: #0f9f8f;
      --teal-soft: #e7f7f4;
      --good: #168455;
      --bad: #c8432f;
      --shadow: 0 18px 40px rgba(31, 41, 55, 0.10);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at top left, rgba(15, 159, 143, 0.16), transparent 340px),
        linear-gradient(135deg, #fff8f3 0%, var(--bg) 42%, #eef6ff 100%);
    }
    main {
      width: min(1200px, calc(100% - 28px));
      margin: 0 auto;
      padding: 28px 0 42px;
    }
    header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 18px;
    }
    h1 {
      margin: 0;
      font-size: clamp(24px, 4vw, 36px);
      line-height: 1.15;
      letter-spacing: 0;
    }
    .mode-tabs {
      display: inline-flex;
      gap: 4px;
      padding: 4px;
      margin: 0 0 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.78);
      box-shadow: 0 10px 24px rgba(31, 41, 55, 0.08);
    }
    .mode-tab {
      min-height: 38px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--muted);
      padding: 0 14px;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }
    .mode-tab.is-active {
      background: var(--teal);
      color: white;
      box-shadow: 0 8px 18px rgba(15, 159, 143, 0.24);
    }
    .mode-panel {
      display: none;
    }
    .mode-panel.is-active {
      display: block;
    }
    [hidden] {
      display: none !important;
    }
    .calculator {
      position: relative;
      z-index: 10;
      overflow: visible;
      display: grid;
      grid-template-columns: minmax(0, 1fr) 300px;
      gap: 16px;
      padding: 16px;
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
      margin-bottom: 18px;
    }
    .controls {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      align-items: start;
      min-width: 0;
    }
    .field, .toggle-label {
      display: grid;
      gap: 7px;
      align-content: start;
      min-width: 0;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }
    .field-label {
      min-height: 18px;
    }
    .type-picker {
      position: relative;
      min-width: 0;
    }
    .type-picker.is-open {
      z-index: 100;
    }
    .picker-button {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      width: 100%;
      min-height: 44px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: var(--ink);
      padding: 6px 10px;
      font: inherit;
      font-weight: 800;
      text-align: left;
      cursor: pointer;
      outline: none;
      transition: border-color 0.16s ease, box-shadow 0.16s ease, opacity 0.16s ease, background 0.16s ease;
    }
    .picker-button:hover {
      border-color: #b8c4d4;
      background: #fbfdff;
    }
    .picker-button:focus-visible {
      border-color: var(--teal);
      box-shadow: 0 0 0 3px rgba(15, 159, 143, 0.14);
    }
    .type-picker.is-disabled .picker-button {
      opacity: 0.48;
      cursor: not-allowed;
      background: #eef2f7;
    }
    .picker-caret {
      color: var(--muted);
      font-size: 12px;
      transition: transform 0.16s ease;
    }
    .type-picker.is-open .picker-caret {
      transform: rotate(180deg);
    }
    .type-menu {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      right: 0;
      display: none;
      grid-template-columns: 1fr;
      gap: 4px;
      width: 100%;
      max-height: 238px;
      overflow: auto;
      margin-top: 0;
      padding: 6px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #ffffff;
      box-shadow: 0 18px 40px rgba(15, 23, 42, 0.20);
    }
    .type-picker.is-open .type-menu {
      display: grid;
    }
    .type-option {
      display: flex;
      align-items: center;
      width: 100%;
      min-height: 38px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--ink);
      padding: 6px 8px;
      font: inherit;
      font-weight: 700;
      text-align: left;
      cursor: pointer;
    }
    .type-option:hover,
    .type-option.is-selected {
      background: var(--teal-soft);
    }
    .type-option:disabled {
      color: #9aa7b8;
      cursor: not-allowed;
      opacity: 0.46;
    }
    .type-option:disabled:hover {
      background: transparent;
    }
    .type-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }
    .type-badge img {
      width: 26px;
      height: 26px;
      flex: 0 0 auto;
      object-fit: contain;
    }
    .type-badge span {
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .type-badge.is-none .empty-icon {
      display: inline-grid;
      place-items: center;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: #e2e8f0;
      color: #64748b;
      font-weight: 900;
    }
    .table-type {
      display: inline-grid;
      justify-items: center;
      gap: 2px;
      font-size: 12px;
      line-height: 1.1;
    }
    .table-type img {
      width: 24px;
      height: 24px;
      object-fit: contain;
    }
    .row-type {
      justify-items: start;
      grid-template-columns: 24px auto;
      align-items: center;
      gap: 6px;
      font-size: 13px;
    }
    .same-type {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: 180px repeat(2, minmax(0, 1fr));
      gap: 12px;
      align-items: end;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel-soft);
      transition: opacity 0.16s ease, background 0.16s ease;
    }
    .same-type.is-disabled {
      background: #f3f6fa;
    }
    .query-panel {
      position: relative;
      z-index: 10;
      display: grid;
      gap: 16px;
      padding: 16px;
      margin-bottom: 18px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.9);
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
    }
    .query-controls {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
      align-items: start;
    }
    .query-summary {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 700;
    }
    .query-summary .result-chip {
      border: 1px solid var(--line);
      background: white;
      color: var(--ink);
    }
    .query-results {
      display: grid;
      gap: 10px;
    }
    .query-group {
      display: grid;
      gap: 8px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel-soft);
    }
    .query-group h2 {
      margin: 0;
      color: #334155;
      font-size: 15px;
      line-height: 1.35;
      letter-spacing: 0;
    }
    .match-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(104px, 1fr));
      gap: 8px;
    }
    .match-item {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 8px;
      min-height: 36px;
      padding: 6px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: white;
      color: var(--ink);
      font-weight: 800;
    }
    .match-item.is-good {
      border-color: rgba(22, 132, 85, 0.22);
      background: var(--teal-soft);
    }
    .match-item.is-bad {
      border-color: rgba(200, 67, 47, 0.22);
      background: var(--accent-soft);
    }
    .match-item.is-strong {
      border-color: rgba(37, 99, 235, 0.22);
      background: #dbeafe;
    }
    .wheel-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(300px, 32%);
      gap: 12px;
      align-items: start;
    }
    .wheel-board {
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: white;
    }
    .wheel-table {
      table-layout: fixed;
      min-width: 720px;
      font-size: 13px;
    }
    .wheel-table th,
    .wheel-table td {
      width: auto;
      height: 42px;
      padding: 6px 7px;
      text-align: left;
    }
    .wheel-table th:nth-child(1),
    .wheel-table td:nth-child(1) { width: 58px; }
    .wheel-table th:nth-child(2),
    .wheel-table td:nth-child(2) { width: 150px; }
    .wheel-table th:nth-child(3),
    .wheel-table td:nth-child(3) { width: 82px; }
    .wheel-table th:nth-child(4),
    .wheel-table td:nth-child(4),
    .wheel-table th:nth-child(5),
    .wheel-table td:nth-child(5) { width: 74px; }
    .wheel-table th:nth-child(n+6),
    .wheel-table td:nth-child(n+6) { width: 56px; }
    .wheel-table th {
      position: sticky;
      top: 0;
      z-index: 1;
    }
    .wheel-table th:first-child,
    .wheel-table td:first-child {
      position: static;
      padding-left: 9px;
    }
    .wheel-table tbody tr {
      cursor: pointer;
    }
    .wheel-table tbody tr:hover td {
      background: #f1f7ff;
    }
    .wheel-table tbody tr.is-selected td {
      background: var(--teal-soft);
    }
    .rank-cell {
      color: var(--muted);
      font-weight: 900;
    }
    .score-cell {
      color: #0f766e;
      font-weight: 900;
    }
    .combo-badges {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      min-width: 0;
    }
    .combo-badges .type-badge {
      gap: 5px;
      font-weight: 900;
    }
    .combo-badges .type-badge img {
      width: 20px;
      height: 20px;
    }
    .wheel-detail {
      display: grid;
      gap: 10px;
      position: sticky;
      top: 12px;
    }
    .wheel-card {
      display: grid;
      gap: 8px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel-soft);
    }
    .wheel-card h2 {
      margin: 0;
      color: #334155;
      font-size: 15px;
      letter-spacing: 0;
    }
    .wheel-stat-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px;
    }
    .wheel-stat {
      display: grid;
      gap: 2px;
      min-width: 0;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: white;
    }
    .wheel-stat strong {
      overflow: hidden;
      font-size: 18px;
      line-height: 1;
      text-overflow: ellipsis;
    }
    .wheel-stat span {
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }
    .wheel-mini-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      max-height: 170px;
      overflow: auto;
    }
    .wheel-mini-list .result-chip {
      border: 1px solid var(--line);
      background: white;
      color: var(--ink);
      font-size: 12px;
    }
    .wheel-mini-list .result-chip.is-good { background: var(--teal-soft); }
    .wheel-mini-list .result-chip.is-bad { background: var(--accent-soft); }
    .toggle-label {
      gap: 9px;
    }
    .switch-row {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      min-height: 44px;
      color: var(--ink);
      font-weight: 900;
    }
    .switch-row input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }
    .switch {
      width: 48px;
      height: 28px;
      padding: 3px;
      border-radius: 999px;
      background: #cbd5e1;
      transition: background 0.18s ease;
    }
    .switch::before {
      content: "";
      display: block;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: white;
      box-shadow: 0 2px 7px rgba(15, 23, 42, 0.24);
      transition: transform 0.18s ease;
    }
    .switch-row input:checked + .switch {
      background: var(--teal);
    }
    .switch-row input:checked + .switch::before {
      transform: translateX(20px);
    }
    .result {
      display: grid;
      align-content: space-between;
      align-self: start;
      min-height: 168px;
      padding: 16px;
      border-radius: 8px;
      color: white;
      background: linear-gradient(145deg, #172033 0%, #24364f 58%, #0d796f 100%);
      overflow: hidden;
      position: relative;
    }
    .result::after {
      content: "";
      position: absolute;
      right: -46px;
      bottom: -58px;
      width: 150px;
      height: 150px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.10);
    }
    .result-label {
      color: #c7d2fe;
      font-size: 13px;
      font-weight: 700;
    }
    .result strong {
      display: block;
      margin: 8px 0 10px;
      font-size: 44px;
      line-height: 1;
      letter-spacing: 0;
    }
    .result-detail {
      position: relative;
      z-index: 1;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      color: #e5edf8;
      font-size: 13px;
      line-height: 1.45;
    }
    .result-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      min-height: 28px;
      max-width: 100%;
      padding: 4px 8px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
    }
    .result-chip img {
      width: 20px;
      height: 20px;
      object-fit: contain;
    }
    .result-chip.is-good { background: rgba(15, 159, 143, 0.32); }
    .result-chip.is-bad { background: rgba(234, 106, 71, 0.28); }
    .result-chip.is-bonus { background: rgba(234, 179, 8, 0.25); }
    .table-wrap {
      position: relative;
      z-index: 1;
      overflow: auto;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }
    table {
      border-collapse: separate;
      border-spacing: 0;
      width: 100%;
      min-width: 1060px;
      font-size: 14px;
    }
    th, td {
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      width: 54px;
      height: 52px;
      text-align: center;
      white-space: nowrap;
    }
    th {
      position: sticky;
      top: 0;
      z-index: 1;
      background: #edf3fb;
      color: #334155;
      font-weight: 800;
    }
    th:first-child {
      left: 0;
      z-index: 2;
      width: 88px;
      min-width: 88px;
    }
    td:first-child {
      position: sticky;
      left: 0;
      width: 88px;
      min-width: 88px;
      padding-left: 9px;
      background: #f7faff;
      color: #334155;
      font-weight: 800;
      text-align: left;
    }
    tbody tr:nth-child(even) td:not(:first-child) {
      background: #fbfdff;
    }
    .super, .resist, .normal {
      font-weight: 900;
    }
    .super {
      color: var(--good);
      background: var(--teal-soft);
    }
    .resist {
      color: var(--bad);
      background: var(--accent-soft);
    }
    .normal { color: #b6c0ce; }
    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 18px;
      margin: 12px 2px 0;
      color: var(--muted);
      font-size: 14px;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    @media (max-width: 1020px) {
      .calculator { grid-template-columns: 1fr; }
      .wheel-layout { grid-template-columns: 1fr; }
      .wheel-detail { position: static; }
      .result { min-height: 132px; }
    }
    @media (max-width: 760px) {
      main { width: min(100% - 20px, 1200px); padding-top: 20px; }
      header { display: block; }
      .mode-tabs { display: grid; grid-template-columns: 1fr; width: 100%; }
      .controls, .same-type { grid-template-columns: 1fr; }
      .query-controls { grid-template-columns: 1fr; }
      .result strong { font-size: 38px; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>属性克制计算器</h1>
      </div>
    </header>

    <div class="mode-tabs" role="tablist" aria-label="计算模式">
      <button class="mode-tab is-active" type="button" data-mode="battle">一回合对战</button>
      <button class="mode-tab" type="button" data-mode="attack">攻击面查询</button>
      <button class="mode-tab" type="button" data-mode="defense">抵抗面查询</button>
      <button class="mode-tab" type="button" data-mode="wheel">车轮榜单</button>
    </div>

    <section id="battlePanel" class="mode-panel is-active" data-panel="battle">
      <div class="calculator" aria-label="一回合对战计算器">
        <div class="controls">
          <div class="field">
            <span class="field-label">攻击技能系别</span>
            <div id="attackPicker" class="type-picker"></div>
          </div>
          <div class="field">
            <span class="field-label">受击系别 1</span>
            <div id="defenseAPicker" class="type-picker"></div>
          </div>
          <div class="field">
            <span class="field-label">受击系别 2</span>
            <div id="defenseBPicker" class="type-picker"></div>
          </div>
          <div id="sameTypePanel" class="same-type">
            <label class="toggle-label">
              本系加成
              <span class="switch-row">
                <input id="sameTypeToggle" type="checkbox">
                <span class="switch" aria-hidden="true"></span>
                <span id="sameTypeStatus">关闭</span>
              </span>
            </label>
            <div class="field">
              <span class="field-label">攻击方自身系别 1</span>
              <div id="attackerAPicker" class="type-picker"></div>
            </div>
            <div class="field">
              <span class="field-label">攻击方自身系别 2</span>
              <div id="attackerBPicker" class="type-picker"></div>
            </div>
          </div>
        </div>
        <div class="result" aria-live="polite">
          <div>
            <div class="result-label">最终倍率</div>
            <strong id="multiplier">1 倍</strong>
          </div>
          <div id="detail" class="result-detail">无克制变化</div>
        </div>
      </div>
    </section>

    <section id="attackPanel" class="mode-panel" data-panel="attack">
      <div class="query-panel" aria-label="攻击面查询">
        <div class="query-controls">
          <div class="field">
            <span class="field-label">攻击技能系别</span>
            <div id="attackQueryPicker" class="type-picker"></div>
          </div>
        </div>
        <div id="attackQuerySummary" class="query-summary"></div>
        <div id="attackQueryResult" class="query-results"></div>
      </div>
    </section>

    <section id="defensePanel" class="mode-panel" data-panel="defense">
      <div class="query-panel" aria-label="抵抗面查询">
        <div class="query-controls">
          <div class="field">
            <span class="field-label">精灵系别 1</span>
            <div id="defenseQueryAPicker" class="type-picker"></div>
          </div>
          <div class="field">
            <span class="field-label">精灵系别 2</span>
            <div id="defenseQueryBPicker" class="type-picker"></div>
          </div>
        </div>
        <div id="defenseQuerySummary" class="query-summary"></div>
        <div id="defenseQueryResult" class="query-results"></div>
      </div>
    </section>

    <section id="wheelPanel" class="mode-panel" data-panel="wheel">
      <div class="query-panel" aria-label="单系与双系车轮战榜单">
        <div class="query-summary" id="wheelSummary"></div>
        <div class="wheel-layout">
          <div class="wheel-board">
            <table id="wheelTable" class="wheel-table" aria-label="车轮战属性组合榜单"></table>
          </div>
          <aside class="wheel-detail" aria-live="polite">
            <section class="wheel-card">
              <h2 id="wheelDetailTitle">属性组合</h2>
              <div id="wheelDetailTypes" class="query-summary"></div>
              <div class="wheel-stat-grid">
                <div class="wheel-stat"><strong id="wheelDetailScore">0</strong><span>综合分</span></div>
                <div class="wheel-stat"><strong id="wheelDetailAttackAvg">0</strong><span>平均输出</span></div>
                <div class="wheel-stat"><strong id="wheelDetailTakenAvg">0</strong><span>平均承伤</span></div>
              </div>
            </section>
            <section class="wheel-card">
              <h2>攻击面</h2>
              <div id="wheelAttackSummary" class="query-summary"></div>
              <div id="wheelAttackList" class="wheel-mini-list"></div>
            </section>
            <section class="wheel-card">
              <h2>抵抗面</h2>
              <div id="wheelDefenseSummary" class="query-summary"></div>
              <div id="wheelDefenseList" class="wheel-mini-list"></div>
            </section>
          </aside>
        </div>
      </div>
    </section>

    <section id="chartSection" aria-label="属性克制表区域">
      <div class="table-wrap">
        <table id="chart" aria-label="属性克制表"></table>
      </div>
      <div class="legend">
        <span class="pill"><span class="super">2</span>造成 2 倍伤害</span>
        <span class="pill"><span class="resist">0.5</span>造成 0.5 倍伤害</span>
        <span class="pill"><span class="normal">1</span>正常伤害</span>
        <span>双系受击：双克制 3 倍，双抵抗 0.25 倍，一克一抵 1 倍。</span>
        <span>本系加成：开启后，技能系别与攻击方自身任一系别相同则再乘 1.25 倍。</span>
      </div>
    </section>
  </main>

  <script>
    const types = ["火","水","草","光","恶魔","幽灵","普通","地面","冰","龙","电","毒","虫","武","翼","萌","机械","幻"];
    const typeIcons = {
      "火": "fire.png",
      "水": "water.png",
      "草": "grass.png",
      "光": "light.png",
      "恶魔": "dark.png",
      "幽灵": "ghost.png",
      "普通": "normal.png",
      "地面": "earth.png",
      "冰": "ice.png",
      "龙": "dragon.png",
      "电": "electric.png",
      "毒": "poison.png",
      "虫": "bug.png",
      "武": "martial.png",
      "翼": "wing.png",
      "萌": "moe.png",
      "机械": "machine.png",
      "幻": "illusion.png"
    };
    const rows = [
      ".RG....RGR..G...G.",
      "G.R....GRR......G.",
      "RG.G...G.R.RR.R.R.",
      "..R.GG..R.........",
      "...RRG.....G.R.G..",
      "...GRGR..........G",
      ".....R.R........R.",
      "G.R.....G.GG.R....",
      "R.G....GRG....G.R.",
      ".........G......R.",
      ".GR....R.RR...G...",
      "..G..R.R...R...GR.",
      "R.G.GR.....R.RRRRG",
      "....GRGGG..RR.RRGR",
      "..G....R.RR.GG..R.",
      "R...G....G.R.G..R.",
      "RR.....GG.R....GR.",
      "...R.......G.G..RR"
    ];
    const chart = Object.fromEntries(types.map((attack, i) => [
      attack,
      Object.fromEntries(types.map((defense, j) => {
        const cell = rows[i][j];
        return [defense, cell === "G" ? 2 : cell === "R" ? 0.5 : 1];
      }))
    ]));

    const state = {
      attack: "火",
      defenseA: "草",
      defenseB: "冰",
      attackerA: "",
      attackerB: "",
      attackQuery: "火",
      defenseQueryA: "草",
      defenseQueryB: "冰",
      wheelSelected: ""
    };
    const pickers = {};
    const modeTabs = document.querySelectorAll(".mode-tab");
    const modePanels = document.querySelectorAll(".mode-panel");
    const chartSection = document.getElementById("chartSection");
    const sameTypePanel = document.getElementById("sameTypePanel");
    const sameTypeToggle = document.getElementById("sameTypeToggle");
    const sameTypeStatus = document.getElementById("sameTypeStatus");
    const multiplier = document.getElementById("multiplier");
    const detail = document.getElementById("detail");
    const attackQuerySummary = document.getElementById("attackQuerySummary");
    const attackQueryResult = document.getElementById("attackQueryResult");
    const defenseQuerySummary = document.getElementById("defenseQuerySummary");
    const defenseQueryResult = document.getElementById("defenseQueryResult");
    const wheelSummary = document.getElementById("wheelSummary");
    const wheelTable = document.getElementById("wheelTable");
    const wheelDetailTitle = document.getElementById("wheelDetailTitle");
    const wheelDetailTypes = document.getElementById("wheelDetailTypes");
    const wheelDetailScore = document.getElementById("wheelDetailScore");
    const wheelDetailAttackAvg = document.getElementById("wheelDetailAttackAvg");
    const wheelDetailTakenAvg = document.getElementById("wheelDetailTakenAvg");
    const wheelAttackSummary = document.getElementById("wheelAttackSummary");
    const wheelAttackList = document.getElementById("wheelAttackList");
    const wheelDefenseSummary = document.getElementById("wheelDefenseSummary");
    const wheelDefenseList = document.getElementById("wheelDefenseList");

    function iconSrc(type) {
      return `assets/type-icons/${typeIcons[type]}`;
    }

    function createTypeBadge(type, label = type, extraClass = "") {
      const badge = document.createElement("span");
      badge.className = `type-badge ${extraClass}`.trim();
      if (type) {
        const img = document.createElement("img");
        img.src = iconSrc(type);
        img.alt = "";
        badge.append(img);
      } else {
        const empty = document.createElement("span");
        empty.className = "empty-icon";
        empty.textContent = "-";
        badge.classList.add("is-none");
        badge.append(empty);
      }
      const text = document.createElement("span");
      text.textContent = label;
      badge.append(text);
      return badge;
    }

    function createTableBadge(type, isRow = false) {
      const badge = document.createElement("span");
      badge.className = isRow ? "table-type row-type" : "table-type";
      const img = document.createElement("img");
      img.src = iconSrc(type);
      img.alt = "";
      const text = document.createElement("span");
      text.textContent = type;
      badge.append(img, text);
      return badge;
    }

    function closePickers(exceptKey = "") {
      Object.entries(pickers).forEach(([key, picker]) => {
        if (key !== exceptKey) {
          picker.root.classList.remove("is-open");
          picker.button.setAttribute("aria-expanded", "false");
        }
      });
    }

    function renderPicker(key) {
      const picker = pickers[key];
      const value = state[key];
      const label = value || "不选择";
      picker.button.replaceChildren(createTypeBadge(value, label));
      const caret = document.createElement("span");
      caret.className = "picker-caret";
      caret.textContent = "▼";
      picker.button.append(caret);
      picker.menu.querySelectorAll(".type-option").forEach(option => {
        option.classList.toggle("is-selected", option.dataset.value === value);
        const disabled = isOptionDisabled(key, option.dataset.value);
        option.disabled = disabled;
        option.setAttribute("aria-disabled", disabled ? "true" : "false");
      });
    }

    function renderAllPickers() {
      Object.keys(pickers).forEach(renderPicker);
    }

    function isOptionDisabled(key, value) {
      if (!value) return false;
      if (key === "defenseB") return value === state.defenseA;
      if (key === "attackerB") return value === state.attackerA;
      if (key === "defenseQueryB") return value === state.defenseQueryA;
      return false;
    }

    function normalizePairedTypes() {
      if (state.defenseA && state.defenseA === state.defenseB) {
        state.defenseB = "";
      }
      if (state.attackerA && state.attackerA === state.attackerB) {
        state.attackerB = "";
      }
      if (state.defenseQueryA && state.defenseQueryA === state.defenseQueryB) {
        state.defenseQueryB = "";
      }
    }

    function setPickerDisabled(key, disabled) {
      const picker = pickers[key];
      picker.root.classList.toggle("is-disabled", disabled);
      picker.button.disabled = disabled;
      if (disabled) {
        picker.root.classList.remove("is-open");
        picker.button.setAttribute("aria-expanded", "false");
      }
    }

    function createPicker(rootId, key, includeNone = false) {
      const root = document.getElementById(rootId);
      const button = document.createElement("button");
      const menu = document.createElement("div");
      button.type = "button";
      button.className = "picker-button";
      button.setAttribute("aria-haspopup", "listbox");
      button.setAttribute("aria-expanded", "false");
      menu.className = "type-menu";
      menu.setAttribute("role", "listbox");

      const options = includeNone ? [{ value: "", label: "不选择" }] : [];
      types.forEach(type => options.push({ value: type, label: type }));
      options.forEach(option => {
        const optionButton = document.createElement("button");
        optionButton.type = "button";
        optionButton.className = "type-option";
        optionButton.dataset.value = option.value;
        optionButton.setAttribute("role", "option");
        optionButton.append(createTypeBadge(option.value, option.label));
        optionButton.addEventListener("click", () => {
          if (isOptionDisabled(key, option.value)) return;
          state[key] = option.value;
          normalizePairedTypes();
          renderAllPickers();
          closePickers();
          renderAllViews();
        });
        menu.append(optionButton);
      });

      button.addEventListener("click", event => {
        event.stopPropagation();
        if (button.disabled) return;
        const willOpen = !root.classList.contains("is-open");
        closePickers(key);
        root.classList.toggle("is-open", willOpen);
        button.setAttribute("aria-expanded", willOpen ? "true" : "false");
      });
      root.append(button, menu);
      pickers[key] = { root, button, menu };
      renderPicker(key);
    }

    function calcSingle(attack, defense) {
      return chart[attack][defense];
    }

    function calcDefenseTotal(attack, defenses) {
      const values = defenses.filter(Boolean).map(defense => calcSingle(attack, defense));
      const superCount = values.filter(value => value === 2).length;
      const resistCount = values.filter(value => value === 0.5).length;
      if (superCount > 0 && resistCount > 0) return 1;
      if (superCount > 0) return 1 + superCount;
      if (resistCount > 0) return 0.5 ** resistCount;
      return 1;
    }

    function makeTypeCombos() {
      const combos = types.map(type => ({ id: type, name: type, types: [type] }));
      types.forEach((typeA, index) => {
        types.slice(index + 1).forEach(typeB => {
          combos.push({ id: `${typeA}+${typeB}`, name: `${typeA}/${typeB}`, types: [typeA, typeB] });
        });
      });
      return combos;
    }

    const typeCombos = makeTypeCombos();

    function comboTypeOrder(combo) {
      return combo.types.reduce((sum, type, index) => sum + types.indexOf(type) * (index + 1), 0);
    }

    function calcBestAttack(attackTypes, defenderTypes) {
      return Math.max(...attackTypes.map(attack => calcDefenseTotal(attack, defenderTypes)));
    }

    function getComboMatchups(combo) {
      const opponents = typeCombos.filter(opponent => opponent.id !== combo.id);
      const attack = opponents.map(opponent => ({
        combo: opponent,
        value: calcBestAttack(combo.types, opponent.types)
      }));
      const defense = opponents.map(opponent => ({
        combo: opponent,
        value: calcBestAttack(opponent.types, combo.types)
      }));
      return { attack, defense };
    }

    function summarizeValues(items) {
      const total = items.reduce((sum, item) => sum + item.value, 0);
      return {
        avg: total / items.length,
        strong: items.filter(item => item.value > 1).length,
        neutral: items.filter(item => item.value === 1).length,
        resisted: items.filter(item => item.value < 1).length,
        severe: items.filter(item => item.value >= 3).length
      };
    }

    function scoreCombo(combo) {
      const matchups = getComboMatchups(combo);
      const attack = summarizeValues(matchups.attack);
      const defense = summarizeValues(matchups.defense);
      const score = attack.avg / defense.avg * 100;
      return { ...combo, matchups, attack, defense, score };
    }

    const wheelRanks = typeCombos
      .map(scoreCombo)
      .sort((a, b) =>
        b.score - a.score ||
        b.attack.strong - a.attack.strong ||
        a.defense.strong - b.defense.strong ||
        comboTypeOrder(a) - comboTypeOrder(b)
      );
    wheelRanks.forEach((combo, index) => {
      combo.rank = index + 1;
    });
    if (!state.wheelSelected) {
      state.wheelSelected = wheelRanks[0].id;
    }

    function formatMultiplier(value) {
      return Number.parseFloat(value.toFixed(4)).toString();
    }

    function formatCompact(value, digits = 2) {
      return Number.parseFloat(value.toFixed(digits)).toString();
    }

    function createResultChip(type, text, className = "") {
      const chip = document.createElement("span");
      chip.className = `result-chip ${className}`.trim();
      if (type) {
        const img = document.createElement("img");
        img.src = iconSrc(type);
        img.alt = "";
        chip.append(img);
      }
      chip.append(document.createTextNode(text));
      return chip;
    }

    function updateSameTypeControls() {
      const enabled = sameTypeToggle.checked;
      setPickerDisabled("attackerA", !enabled);
      setPickerDisabled("attackerB", !enabled);
      sameTypePanel.classList.toggle("is-disabled", !enabled);
      sameTypeStatus.textContent = enabled ? "开启" : "关闭";
      if (enabled && !state.attackerA) {
        state.attackerA = state.attack;
      }
      normalizePairedTypes();
      renderAllPickers();
    }

    function renderAllViews() {
      renderResult();
      renderAttackQuery();
      renderDefenseQuery();
      renderWheelDetail();
    }

    function renderResult() {
      const attack = state.attack;
      const defenses = [state.defenseA, state.defenseB].filter(Boolean);
      const defenseTotal = calcDefenseTotal(attack, defenses);
      const attackerTypes = sameTypeToggle.checked
        ? [state.attackerA, state.attackerB].filter(Boolean)
        : [];
      const hasSameTypeBonus = attackerTypes.includes(attack);
      const sameTypeMultiplier = hasSameTypeBonus ? 1.25 : 1;
      const total = defenseTotal * sameTypeMultiplier;

      multiplier.textContent = `${formatMultiplier(total)} 倍`;
      detail.replaceChildren();
      if (defenses.length === 0) {
        detail.append(createResultChip("", "请选择受击系别"));
      } else {
        defenses.forEach(defense => {
          const value = calcSingle(attack, defense);
          if (value === 2) detail.append(createResultChip(defense, `${defense}：克制`, "is-good"));
          else if (value === 0.5) detail.append(createResultChip(defense, `${defense}：抵抗`, "is-bad"));
          else detail.append(createResultChip(defense, `${defense}：正常`));
        });
      }
      const bonusText = sameTypeToggle.checked
        ? (hasSameTypeBonus ? "本系加成：x1.25" : "本系加成：未触发")
        : "本系加成：未开启";
      detail.append(createResultChip("", bonusText, "is-bonus"));
    }

    function createQueryItem(type, variant = "") {
      const item = document.createElement("div");
      item.className = `match-item ${variant}`.trim();
      item.append(createTypeBadge(type));
      return item;
    }

    function createQueryGroup(title, items, variant = "") {
      const group = document.createElement("section");
      group.className = "query-group";
      const heading = document.createElement("h2");
      heading.textContent = `${title}（${items.length}）`;
      const list = document.createElement("div");
      list.className = "match-list";
      items.forEach(item => list.append(createQueryItem(item.type, variant)));
      group.append(heading, list);
      return group;
    }

    function createComboBadges(combo) {
      const wrap = document.createElement("span");
      wrap.className = "combo-badges";
      combo.types.forEach(type => wrap.append(createTypeBadge(type)));
      return wrap;
    }

    function groupByValue(items, definitions) {
      return definitions.map(definition => ({
        ...definition,
        items: items.filter(item => item.value === definition.value)
      }));
    }

    function sortByTypeOrder(a, b) {
      return types.indexOf(a.type) - types.indexOf(b.type);
    }

    function renderAttackQuery() {
      const attack = state.attackQuery;
      const items = types
        .map(type => ({ type, value: calcSingle(attack, type) }))
        .sort((a, b) => b.value - a.value || sortByTypeOrder(a, b));
      const strong = items.filter(item => item.value === 2).length;
      const neutral = items.filter(item => item.value === 1).length;
      const resisted = items.filter(item => item.value === 0.5).length;
      attackQuerySummary.replaceChildren(
        createResultChip(attack, `${attack} 技能`),
        createResultChip("", `克制 ${strong}`),
        createResultChip("", `正常 ${neutral}`),
        createResultChip("", `被抵抗 ${resisted}`)
      );
      attackQueryResult.replaceChildren();
      groupByValue(items, [
        { title: "克制面 x2", value: 2, variant: "is-good" },
        { title: "正常面 x1", value: 1, variant: "" },
        { title: "抵抗面 x0.5", value: 0.5, variant: "is-bad" }
      ]).forEach(group => attackQueryResult.append(createQueryGroup(group.title, group.items, group.variant)));
    }

    function renderDefenseQuery() {
      const defenses = [state.defenseQueryA, state.defenseQueryB].filter(Boolean);
      const items = types
        .map(type => ({ type, value: calcDefenseTotal(type, defenses) }))
        .sort((a, b) => a.value - b.value || sortByTypeOrder(a, b));
      const resistant = items.filter(item => item.value < 1).length;
      const neutral = items.filter(item => item.value === 1).length;
      const weak = items.filter(item => item.value > 1).length;
      defenseQuerySummary.replaceChildren(
        ...defenses.map(type => createResultChip(type, type)),
        createResultChip("", `抵抗 ${resistant}`),
        createResultChip("", `正常 ${neutral}`),
        createResultChip("", `弱点 ${weak}`)
      );
      defenseQueryResult.replaceChildren();
      groupByValue(items, [
        { title: "强抵抗，受到 x0.25", value: 0.25, variant: "is-good" },
        { title: "抵抗，受到 x0.5", value: 0.5, variant: "is-good" },
        { title: "正常，受到 x1", value: 1, variant: "" },
        { title: "被克制，受到 x2", value: 2, variant: "is-bad" },
        { title: "严重被克制，受到 x3", value: 3, variant: "is-bad" }
      ]).forEach(group => defenseQueryResult.append(createQueryGroup(group.title, group.items, group.variant)));
    }

    function createCell(text, className = "") {
      const td = document.createElement("td");
      td.textContent = text;
      if (className) td.className = className;
      return td;
    }

    function createComboCell(combo) {
      const td = document.createElement("td");
      td.append(createComboBadges(combo));
      return td;
    }

    function renderWheelTable() {
      const header = document.createElement("thead");
      const headerRow = document.createElement("tr");
      ["排名", "系别", "综合", "输出", "承伤", "克制", "被抗", "抵抗", "弱点"].forEach(text => {
        const th = document.createElement("th");
        th.textContent = text;
        headerRow.append(th);
      });
      header.append(headerRow);

      const body = document.createElement("tbody");
      wheelRanks.forEach(combo => {
        const row = document.createElement("tr");
        row.dataset.comboId = combo.id;
        row.classList.toggle("is-selected", combo.id === state.wheelSelected);
        row.append(
          createCell(`#${combo.rank}`, "rank-cell"),
          createComboCell(combo),
          createCell(formatCompact(combo.score, 1), "score-cell"),
          createCell(`x${formatCompact(combo.attack.avg)}`),
          createCell(`x${formatCompact(combo.defense.avg)}`),
          createCell(String(combo.attack.strong)),
          createCell(String(combo.attack.resisted)),
          createCell(String(combo.defense.resisted)),
          createCell(String(combo.defense.strong))
        );
        row.addEventListener("click", () => {
          state.wheelSelected = combo.id;
          renderWheelTable();
          renderWheelDetail();
        });
        body.append(row);
      });
      wheelTable.replaceChildren(header, body);
    }

    function matchupVariant(value, isDefense = false) {
      if (value > 1) return isDefense ? "is-bad" : "is-good";
      if (value < 1) return isDefense ? "is-good" : "is-bad";
      return "";
    }

    function createComboChip(matchup, isDefense = false) {
      const chip = document.createElement("span");
      chip.className = `result-chip ${matchupVariant(matchup.value, isDefense)}`.trim();
      chip.append(createComboBadges(matchup.combo), document.createTextNode(` x${formatMultiplier(matchup.value)}`));
      return chip;
    }

    function renderMatchupList(root, items, isDefense = false) {
      const sorted = [...items].sort((a, b) =>
        (isDefense ? a.value - b.value : b.value - a.value) ||
        comboTypeOrder(a.combo) - comboTypeOrder(b.combo)
      );
      root.replaceChildren();
      sorted.forEach(item => root.append(createComboChip(item, isDefense)));
    }

    function renderWheelDetail() {
      const selected = wheelRanks.find(combo => combo.id === state.wheelSelected) || wheelRanks[0];
      wheelSummary.replaceChildren(
        createResultChip("", `共 ${typeCombos.length} 种单系/双系组合`),
        createResultChip("", "进攻取自身系别中的最高伤害"),
        createResultChip("", "防守按对手自身系别中的最高伤害承伤")
      );
      wheelDetailTitle.textContent = `#${selected.rank} ${selected.name}`;
      wheelDetailTypes.replaceChildren(...selected.types.map(type => createResultChip(type, type)));
      wheelDetailScore.textContent = formatCompact(selected.score, 1);
      wheelDetailAttackAvg.textContent = `x${formatCompact(selected.attack.avg)}`;
      wheelDetailTakenAvg.textContent = `x${formatCompact(selected.defense.avg)}`;
      wheelAttackSummary.replaceChildren(
        createResultChip("", `克制 ${selected.attack.strong}`),
        createResultChip("", `正常 ${selected.attack.neutral}`),
        createResultChip("", `被抵抗 ${selected.attack.resisted}`)
      );
      wheelDefenseSummary.replaceChildren(
        createResultChip("", `抵抗 ${selected.defense.resisted}`),
        createResultChip("", `正常 ${selected.defense.neutral}`),
        createResultChip("", `弱点 ${selected.defense.strong}`)
      );
      renderMatchupList(wheelAttackList, selected.matchups.attack, false);
      renderMatchupList(wheelDefenseList, selected.matchups.defense, true);
    }

    function renderTable() {
      const table = document.getElementById("chart");
      const thead = document.createElement("thead");
      const headRow = document.createElement("tr");
      const corner = document.createElement("th");
      corner.textContent = "攻击\\受击";
      headRow.append(corner);
      types.forEach((type, colIndex) => {
        const th = document.createElement("th");
        th.dataset.col = String(colIndex);
        th.append(createTableBadge(type));
        headRow.append(th);
      });
      thead.append(headRow);

      const tbody = document.createElement("tbody");
      types.forEach((attack, rowIndex) => {
        const tr = document.createElement("tr");
        const rowHead = document.createElement("td");
        rowHead.dataset.row = String(rowIndex);
        rowHead.append(createTableBadge(attack, true));
        tr.append(rowHead);
        types.forEach((defense, colIndex) => {
          const td = document.createElement("td");
          const value = chart[attack][defense];
          td.textContent = value;
          td.className = value === 2 ? "super" : value === 0.5 ? "resist" : "normal";
          tr.append(td);
        });
        tbody.append(tr);
      });
      table.append(thead, tbody);
    }

    createPicker("attackPicker", "attack");
    createPicker("defenseAPicker", "defenseA");
    createPicker("defenseBPicker", "defenseB", true);
    createPicker("attackerAPicker", "attackerA", true);
    createPicker("attackerBPicker", "attackerB", true);
    createPicker("attackQueryPicker", "attackQuery");
    createPicker("defenseQueryAPicker", "defenseQueryA");
    createPicker("defenseQueryBPicker", "defenseQueryB", true);
    sameTypeToggle.addEventListener("change", () => {
      updateSameTypeControls();
      renderAllViews();
    });
    modeTabs.forEach(tab => {
      tab.addEventListener("click", () => {
        const mode = tab.dataset.mode;
        modeTabs.forEach(item => item.classList.toggle("is-active", item === tab));
        modePanels.forEach(panel => panel.classList.toggle("is-active", panel.dataset.panel === mode));
        chartSection.hidden = mode === "wheel";
        closePickers();
      });
    });
    document.addEventListener("click", () => closePickers());
    document.addEventListener("keydown", event => {
      if (event.key === "Escape") closePickers();
    });

    renderTable();
    renderWheelTable();
    updateSameTypeControls();
    renderAllViews();
  </script>
</body>
</html>
